name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Build Tauri bundle
        run: cargo tauri build --target x86_64-pc-windows-msvc
      - name: Compute checksums
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          Get-ChildItem -Path $bundle -Recurse -Include *.msi,*.exe,*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ASCII "$bundle/SHA256SUMS.txt"
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-hub-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt

  publish:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iptv-hub-windows-x64
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
