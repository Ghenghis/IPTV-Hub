name: security

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '17 6 * * 1'  # weekly Monday 06:17 UTC

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit (fail on critical/high)
        # RUSTSEC-2023-0071 (medium 5.9) is a Marvin-attack timing sidechannel
        # in `rsa 0.9.x`, transitively pulled in via `sqlx-mysql` — we ship
        # `sqlx` with only the `sqlite` feature and never construct an
        # `RsaPrivateKey` at runtime, so the vulnerable code path is
        # unreachable. Documented in SECURITY_AUDIT.md. CONTRACT §3 only
        # gates "unaddressed critical/high"; this is an addressed medium.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Audit
        run: cd frontend && npm audit --audit-level=high

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
