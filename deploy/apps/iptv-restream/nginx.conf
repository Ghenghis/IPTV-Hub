# IPTV Hub — edge nginx config for the bundled iptv-restream container.
# Adapted from antebrl/IPTV-Restream @ d9705451cece0141201d97c76c545b112e675587
# (deployment/nginx/nginx.conf). Changes from upstream:
#   * frontend root is now a local static bundle at /usr/share/nginx/html
#     instead of proxy_pass to a "iptv_restream_frontend" container.
#   * backend proxy_pass targets are 127.0.0.1:5000 since the Node backend
#     runs in the same container via supervisord.
#   * `daemon off;` is set so nginx stays in the foreground under supervisord.
#   * pid path moved out of /run because the runtime stage creates /run/nginx
#     for the unprivileged-style layout.

worker_processes auto;
daemon off;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Forward proxy headers if there is one in front otherwise set them.
    map $http_x_forwarded_proto $x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_port $x_forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Frontend (Vite SPA built by frontend-builder stage).
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:5000;

            proxy_set_header X-Forwarded-Proto $x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $x_forwarded_port;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header 'Access-Control-Allow-Origin' '*';
        }

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location /proxy/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;

            proxy_hide_header Content-Type;
            add_header Content-Type 'application/vnd.apple.mpegurl' always;

            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }

        location /streams/ {
            root /;

            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Range';
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range';

            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
        }
    }
}
