; IPTV Hub — supervisord process tree for the bundled iptv-restream container.
; Runs two foreground processes:
;   * nginx — edge HTTP server on :80 (also serves the Vite SPA static bundle).
;   * node — the backend Express+socket.io server from antebrl/IPTV-Restream
;     listening on 127.0.0.1:5000 (consumed only by the colocated nginx).

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:backend]
command=/usr/local/bin/node server.js
directory=/opt/iptv-restream/backend
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
environment=NODE_ENV="production",STORAGE_PATH="/streams/"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
