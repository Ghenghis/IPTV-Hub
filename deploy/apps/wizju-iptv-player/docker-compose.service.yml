# wizju-iptv-player — docker-compose service fragment.
#
# Merged into deploy/docker-compose.apps.yml by deploy/scripts/generate-stack.sh.
#
# Port policy (deploy/PORTS.md, app #23):
#   host  9820 (127.0.0.1)  -> container 80 (nginx)
#
# The container only listens on 80 internally; the host edge nginx proxies
# 9820 -> 80. No public port exposure here — Caddy/nginx terminates TLS at the
# edge and forwards to 127.0.0.1:9820.

services:
  wizju-iptv-player:
    build:
      # Build context is the per-app deploy folder. The Dockerfile clones nothing;
      # operators that want to rebuild from a newer upstream commit must update
      # the build context (e.g. by checking the upstream into ./upstream/ or by
      # passing a different context path on the deploy host).
      context: ./apps/wizju-iptv-player/upstream
      dockerfile: ../Dockerfile
    image: iptv-hub/wizju-iptv-player:local
    container_name: ${COMPOSE_PROJECT_NAME:-iptv-hub}_wizju-iptv-player
    restart: unless-stopped
    networks:
      - iptv_hub_net
    ports:
      # 9820 -> 80 ; loopback bind so only the host's nginx can reach it.
      - "127.0.0.1:9820:80"
    healthcheck:
      # nginx 1.27-alpine has wget(busybox); curl is not present.
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=2", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      iptv-hub.app-id: wizju-iptv-player
      iptv-hub.role: web-app
      iptv-hub.port.http: "9820"
      iptv-hub.upstream: "https://github.com/j2jstudio/wizju-iptv-player"
