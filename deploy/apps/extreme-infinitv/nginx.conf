# Extreme InfiniTV — static SPA server config.
#
# Mounted at /etc/nginx/conf.d/default.conf inside the runtime image. Replaces
# the stock nginx default that serves /usr/share/nginx/html.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro's client-side router needs deep links (e.g. /livetv, /movies/123) to
    # fall back to the SPA shell rather than returning a 404.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Long-lived caching for the hashed asset bundles Astro emits under /_astro/.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache the entry HTML — we want updated builds visible immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Gzip for the text-heavy bundles.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Don't leak the nginx version.
    server_tokens off;
}
