# IPTV Hub — nuvioweb nginx site config.
#
# Listens on container port 8080 (mapped to host 9730 by docker-compose).
# NuvioWeb is a single-page web client; assets are referenced by relative path
# from index.html so a simple try_files fallback is enough — there is no client
# router that needs catch-all rewrites.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security/UX headers. CSP is intentionally permissive because the app
    # loads user-supplied Stremio addon URLs at runtime; tightening it here
    # would break the documented use case. The reverse proxy in front of us
    # (host nginx, see deploy/nginx/iptv-hub-site.conf.template) adds TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Long cache for fingerprinted assets; short cache for the entry HTML so
    # a redeploy is picked up immediately by browsers.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # gzip the textual mime types we actually serve.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
