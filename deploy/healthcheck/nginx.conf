# Nginx config for the healthcheck aggregator. Serves a tiny JSON status page
# that `scripts/verify.sh` updates after each verification run. Loopback-only.
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root /usr/share/nginx/html;
    index status.json;

    location = /status.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
