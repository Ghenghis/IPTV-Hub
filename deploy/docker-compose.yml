# IPTV Hub — root docker-compose orchestrator (nginx-integrated edition).
#
# The VPS already runs nginx on host 80/443 fronting daveai.tech (Cloudflare → nginx,
# SSL Full mode). Standing up Caddy here would either fail to bind 80/443 or fight
# the existing edge for ACME challenges. So this compose stack does NOT include a
# reverse proxy: each app service binds to `127.0.0.1:<policy-port>` only, and the
# operator-side `deploy.py` writes nginx site fragments into `/etc/nginx/conf.d/`
# that proxy `<app-id>.<DEPLOY_DOMAIN>` to each policy port.
#
# Per-app services live in `docker-compose.apps.yml`, generated by
# `scripts/generate-stack.sh` from `ports.json` + `inventory-status.json`. Bring up:
#
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d
#
# `scripts/deploy.py` runs that command over SSH after SCP'ing every artifact.

name: ${COMPOSE_PROJECT_NAME:-iptv-hub}

networks:
  # Shared bridge. App services join this network so they can talk to each other
  # without exposing host ports. Each app additionally publishes its policy port
  # on 127.0.0.1 so the host's nginx can reach it.
  iptv_hub_net:
    driver: bridge

services:
  # Healthcheck aggregator — tiny Nginx that serves the verify dashboard JSON.
  # Bound to 127.0.0.1 only; the host's edge nginx may proxy it to a subpath
  # like /iptv-hub/status if the operator wants a dashboard URL.
  healthcheck:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-iptv-hub}_healthcheck
    restart: unless-stopped
    networks:
      - iptv_hub_net
    ports:
      - "127.0.0.1:9885:8080"
    volumes:
      - ./healthcheck/html:/usr/share/nginx/html:ro
      - ./healthcheck/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      iptv-hub.role: healthcheck-aggregator
      iptv-hub.version: "1"
