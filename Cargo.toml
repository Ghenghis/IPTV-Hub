[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.78"
license       = "MIT"
repository    = "https://github.com/ShadowByte/iptv-hub"
authors       = ["ShadowByte"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all       = { level = "deny", priority = -1 }
pedantic  = { level = "warn", priority = -1 }
nursery   = { level = "warn", priority = -1 }
# Pedantic exceptions justified for an application (not a library):
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1
strip       = "symbols"
panic       = "abort"

[profile.dev]
opt-level   = 0
debug       = 2
incremental = true
